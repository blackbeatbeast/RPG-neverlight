name: Project Neverlight CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Validate blueprint
        run: node scripts/validate-blueprint.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate content bundle
        run: pnpm content:validate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Test e2e (mobile)
        run: pnpm exec playwright test --config=apps/web/playwright.config.ts --project=mobile
      - name: Test e2e (desktop)
        run: pnpm exec playwright test --config=apps/web/playwright.config.ts --project=desktop
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-002-ui-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            test-results/issue-002
            playwright-report/issue-002
